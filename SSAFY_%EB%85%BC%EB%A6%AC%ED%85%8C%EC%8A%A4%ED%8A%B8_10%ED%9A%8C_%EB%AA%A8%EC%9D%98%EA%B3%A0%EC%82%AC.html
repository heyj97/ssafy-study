function startTimer(){stop();tick=setInterval(()=>{if(active<0)return;let r=record(active);if(r.done[r.part])return;r.elapsed[r.part]++;if(r.elapsed[r.part]>=1500){r.elapsed[r.part]=1500;save();finishPart(true);return}const t=$('timer');if(t){t.textContent=fmt(1500-r.elapsed[r.part]);t.classList.toggle('urgent',1500-r.elapsed[r.part]<=180)}if(r.elapsed[r.part]%5===0)save()},1000)}function fmt(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
function showQuestion(){let i=active,r=record(i),q=EXAMS[i][position],part=r.part,begin=part?12:0,end=part?20:12,answered=Object.keys(r.answers).filter(k=>+k>=begin&&+k<end&&String(r.answers[k]).trim()).length;let options=q.type==='mc'?q.choices.map((v,n)=>`<label class="option ${r.answers[position]===v?'selected':''}"><input type="radio" name="pick" value="${escapeHTML(v)}" ${r.answers[position]===v?'checked':''} onchange="setAnswer(this.value)"><b>${n+1}</b><span>${escapeHTML(v)}</span></label>`).join(''):`<input class="field" type="text" inputmode="numeric" placeholder="정답 숫자를 입력하세요" value="${escapeHTML(r.answers[position]??'')}" oninput="setAnswer(this.value,true)" autocomplete="off">`;
$('app').innerHTML=`<div class="topline"><button class="outline" onclick="home()">← 회차 목록</button><span id="timer" class="timer ${1500-r.elapsed[part]<=180?'urgent':''}">${fmt(1500-r.elapsed[part])}</span></div><div class="parttag">${i+1}회 · ${part?'파트 2: 주관식':'파트 1: 객관식'} · ${answered}/${end-begin} 응답</div><div class="progress"><div style="width:${answered/(end-begin)*100}%"></div></div><div class="numbers">${Array.from({length:end-begin},(_,n)=>`<button class="${position===begin+n?'current':''} ${String(r.answers[begin+n]??'').trim()?'answered':''}" onclick="go(${begin+n})">${n+1}</button>`).join('')}</div><section class="card questionBox"><span class="qnum">QUESTION ${position-begin+1} / ${end-begin}</span><div class="prompt">${escapeHTML(q.question)}</div>${options}</section><div class="nav"><button class="secondary" onclick="go(${Math.max(begin,position-1)})" ${position===begin?'disabled':''}>이전</button>${position===end-1?`<button class="primary" onclick="finishPart(false)">${part?'최종 채점':'파트 1 제출'}</button>`:`<button class="primary" onclick="go(${position+1})">다음 문제 →</button>`}</div><p class="small" style="margin-top:20px">답변은 자동 저장됩니다. 제한시간은 실제 시험처럼 진행 중 계속 흐르지만, 학습용으로 중간에 회차 목록으로 돌아갈 수 있습니다.</p>`}
function setAnswer(v,typing=false){let r=record(active);r.answers[position]=v;save();if(!typing)showQuestion();else{let p=$('.parttag');if(p){let b=r.part?12:0,e=r.part?20:12;p.textContent=`${active+1}회 · ${r.part?'파트 2: 주관식':'파트 1: 객관식'} · ${Object.keys(r.answers).filter(k=>+k>=b&&+k<e&&String(r.answers[k]).trim()).length}/${e-b} 응답`}}}function go(n){position=n;showQuestion()}
function finishPart(auto){let r=record(active),part=r.part,b=part?12:0,e=part?20:12,blank=EXAMS[active].slice(b,e).filter((_,j)=>!String(r.answers[b+j]??'').trim()).length;if(!auto&&blank&&!confirm(`미응답 ${blank}문항이 있습니다. 이 파트를 제출할까요?`))return;r.done[part]=true;save();stop();if(!part){r.part=1;position=12;save();$('app').innerHTML=`<section class="hero"><span class="eyebrow">PART 1 COMPLETE</span><h1>객관식 파트 완료</h1><p>12문항 중 ${score(active,0)}문항 정답입니다. 다음은 주관식 8문항이며 제한시간은 25분입니다.</p><button class="primary" onclick="showQuestion();startTimer()">주관식 시작 →</button> <button class="outline" onclick="home()">나중에 이어 풀기</button></section>`}else results()}
function results(){stop();let i=active,r=record(i),s1=score(i,0),s2=score(i,1);$('app').innerHTML=`<div class="topline"><button class="outline" onclick="home()">← 회차 목록</button><span class="pill">${i+1}회 결과</span></div><section class="hero"><span class="eyebrow">RESULT REPORT</span><h1>${s1+s2} / 20 정답</h1><p>객관식 ${s1}/12 · 주관식 ${s2}/8 · 총 정답률 ${Math.round((s1+s2)/20*100)}%</p><div class="progress"><div style="width:${(s1+s2)*5}%"></div></div><div class="toolbar"><button class="secondary" onclick="if(confirm('이 회차 기록을 초기화하고 다시 풀까요?')){delete state[${i}];save();openExam(${i})}">이 회차 다시 풀기</button><button class="outline" onclick="home()">다른 회차 선택</button></div></section><h2>문항별 정답 및 해설</h2>${EXAMS[i].map((q,n)=>{let mine=String(r.answers[n]??'').trim(),ok=mine.replace(/,/g,'')===q.answer;return `<div class="resultrow"><span class="small">${n<12?'객관식':'주관식'} · ${n+1}번</span><div style="margin-top:6px;font-weight:650;line-height:1.6">${escapeHTML(q.question)}</div><div class="answer ${ok?'':'bad'}"><strong>${ok?'정답':'오답 / 미응답'}</strong><div class="small" style="margin-top:8px">내 답: ${escapeHTML(mine||'미응답')} · 정답: <b>${escapeHTML(q.answer)}</b></div><div style="margin-top:9px;line-height:1.6">${escapeHTML(q.explanation)}</div></div></div>`}).join('')}`}
home();</script></body></html>
